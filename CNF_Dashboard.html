<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C&F Management Dashboard</title>

<!-- ============================================================
     C&F MANAGEMENT ERP – EXECUTIVE DASHBOARD  (single editable file)
     Sections:  1) CSS  2) HTML shell  3) JS: CONFIG, DATA SERVICE,
     ACCOUNTS ENGINE, GRID, CHARTS, TABS, EXPORT
     External libraries (CDN): Chart.js, SheetJS (Excel), jsPDF (+AutoTable)
     ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
/* ============ 1. THEME  (edit colours / fonts here) ============ */
:root{
  --bg:#f1f4f9; --card:#ffffff; --ink:#1a2740; --muted:#6a7a91; --line:#e3e9f2; --line2:#eef2f8;
  --brand:#0a2f6c; --brand-2:#0b57d0; --focus:#9cc0ff;
  --blue:#0b57d0; --green:#1b8a3c; --orange:#f08c00; --purple:#8e24aa; --sky:#0a9ac9; --red:#d92d3a; --slate:#64748b; --teal:#0f9d8a;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.05);
  --font:"Segoe UI",Inter,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --maxw:1680px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font)}
h1,h2,h3{margin:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px}

/* ---- top bar ---- */
.topbar{background:linear-gradient(100deg,var(--brand) 0%,#0b43a6 100%);color:#fff}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.topbar h1{font-size:18px;font-weight:650;letter-spacing:.2px}
.topbar .sub{font-size:12px;opacity:.8}
.topbar .sp{flex:1}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap}

/* ---- filter bar ---- */
.filterbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 8px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fcard .ftitle{display:flex;align-items:center;gap:6px;font-weight:650;color:var(--brand);align-self:center;margin-right:4px}
.f{display:flex;flex-direction:column;gap:3px;min-width:112px;flex:1 1 112px}
.f.date{flex:0 1 134px;min-width:128px}
.f label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.f input,.f select{height:34px;border:1px solid #cfd8e6;border-radius:8px;padding:0 9px;background:#fff;width:100%;outline:none}
.f input:focus,.f select:focus,.gtools input:focus,.gtools select:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(11,87,208,.14)}
.f.off{opacity:.45;pointer-events:none}
.btn{height:34px;border:0;border-radius:8px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--brand-2);color:#fff}.btn.primary:hover{background:#0948ac}
.btn.ghost{background:#fff;border:1px solid #cfd8e6;color:var(--ink)}.btn.ghost:hover{background:#f4f7fc}
.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:#157032}
.fbtns{display:flex;gap:8px;margin-left:auto}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.16);min-width:190px;padding:6px;z-index:50}
.menu.open .pop{display:block}
.pop button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px;display:flex;gap:9px;align-items:center;cursor:pointer}
.pop button:hover{background:#eef3fc}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:11px 16px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--brand-2)}
.tab.on{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.panel{display:none}.panel.on{display:block}
.ptitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.ptitle h2{font-size:17px;color:var(--brand)}
.ptitle span{color:var(--muted);font-size:12px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.subnav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.subnav button.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.sub{display:none}.sub.on{display:block}

/* ---- KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:3px solid var(--c);padding:13px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.kico{width:46px;height:46px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.kbody{min-width:0}
.klabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:650}
.kval{font-size:20px;font-weight:700;line-height:1.2;white-space:nowrap}
.ksub{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.ksub b{color:var(--ink)}
.blue{--c:var(--blue)}.green{--c:var(--green)}.orange{--c:var(--orange)}.purple{--c:var(--purple)}.sky{--c:var(--sky)}.red{--c:var(--red)}.teal{--c:var(--teal)}.slate{--c:var(--slate)}
.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1760px){.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.mini{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--blue));border-radius:10px;padding:9px 12px}
.mini .klabel{font-size:10px}.mini .kval{font-size:16px}
.up{color:var(--green)}.dn{color:var(--red)}

/* ---- cards & charts ---- */
.row{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px 0}
.card h3{font-size:13px;font-weight:650;color:var(--ink)}
.card .hint{font-size:11px;color:var(--muted)}
.cwrap{position:relative;height:262px;padding:8px 10px 12px}
.cwrap.tall{height:300px}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:20px}

/* ---- grids ---- */
.gridcard .gh{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.gtools select,.gtools input{height:30px;border:1px solid #cfd8e6;border-radius:7px;padding:0 8px;background:#fff;outline:none}
.gtools input{width:210px}
.gbody{padding:0 14px 12px}
table.grid{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto}
.grid th{background:#f6f8fc;color:#33445f;font-weight:650;text-align:center;padding:8px 6px;border:1px solid var(--line);font-size:11.5px;position:relative}
.grid th.sortable{cursor:pointer;user-select:none}
.grid th.sortable:hover{background:#eaf0fa}
.grid th .si{opacity:.35;font-size:9px;margin-left:3px}
.grid th.asc .si,.grid th.desc .si{opacity:1;color:var(--brand-2)}
.grid td{padding:7px 7px;border:1px solid var(--line2);vertical-align:middle;overflow-wrap:anywhere}
.grid tbody tr:nth-child(even){background:#fafbfe}
.grid tbody tr:hover{background:#eef4ff}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid td.ctr{text-align:center}
.grid td.nw,.grid tfoot td{white-space:nowrap}
.grid td.mono{font-variant-numeric:tabular-nums;font-weight:600;color:#183b78}
.grid tfoot td{background:#f1f5fb;font-weight:700;border-top:2px solid #cdd7e8}
.grid tr.l1 td{background:#dfeee6;font-weight:700}
.grid tr.l2 td{background:#edf4f0;font-weight:700}
.grid tr.l3 td{font-weight:650;background:#f8fbf9}
.grid tr.l4 td{font-weight:500}
.grid tr.head td{background:#e8effa;font-weight:700;color:var(--brand)}
.grid tr.sub td{font-weight:650;background:#f6f8fc}
.grid tr.total td{font-weight:800;background:#dfeaf9;border-top:2px solid #b7c9e6}
.grid tr.empty-row td{text-align:center;color:var(--muted);padding:26px}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}
.pager{display:flex;gap:4px;flex-wrap:wrap}
.pager button{min-width:30px;height:28px;border:1px solid #d3dcea;background:#fff;border-radius:6px;cursor:pointer;padding:0 8px;color:#33445f}
.pager button:hover:not(:disabled){background:#eef3fc}
.pager button.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.pager .dots{align-self:center;padding:0 4px;color:var(--muted)}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:650;white-space:nowrap}
.s-pending,.s-due,.s-incomplete{background:#fff1da;color:#a85f00}
.s-in-transit,.s-partial{background:#f1e2f7;color:#7a1f94}
.s-delivered,.s-paid,.s-approved,.s-complete{background:#dcf3e3;color:#17702f}
.s-rejected{background:#fde1e3;color:#b3202b}
.pos{color:var(--green)}.neg{color:var(--red)}

/* hide-by-width helpers for grid columns */
@media (max-width:1250px){.h-lg{display:none}}
@media (max-width:1000px){.h-md{display:none}.grid tr.grp{display:none}}
@media (max-width:1100px){table.grid{font-size:11px}.grid th{font-size:10.5px;padding:6px 3px}.grid td{padding:5px 4px}}

/* ---- responsive ---- */
@media (max-width:1180px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.c21,.c12{grid-template-columns:1fr}}
@media (max-width:860px){.c2,.c3{grid-template-columns:1fr}.gtools input{width:150px}}
@media (max-width:1100px){
  table.g1100 thead{display:none}
  table.g1100,table.g1100 tbody,table.g1100 tr,table.g1100 td{display:block;width:100%}
  table.g1100 tr{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
  table.g1100 td{display:flex;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--line2);text-align:right!important}
  table.g1100 td::before{content:attr(data-l);color:var(--muted);font-weight:600;text-align:left}
  table.g1100 tfoot{display:none}
}
@media (max-width:760px){
  table.g760 thead{display:none}
  table.g760,table.g760 tbody,table.g760 tr,table.g760 td{display:block;width:100%}
  table.g760 tr{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
  table.g760 td{display:flex;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--line2);text-align:right!important}
  table.g760 td::before{content:attr(data-l);color:var(--muted);font-weight:600;text-align:left}
  table.g760 tfoot{display:none}
  .h-lg,.h-md{display:flex!important}
  .wrap{padding:0 10px}.kpis,.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}.kval{font-size:16px}.kico{width:34px;height:34px}.kico svg{width:18px;height:18px}
  .kpi{flex-direction:column;align-items:flex-start;gap:8px}.filterbar{position:static}
  .fbtns{width:100%}.fbtns .btn{flex:1;justify-content:center}.f.date{flex:1 1 130px}
  .cwrap{height:240px}
}
@media (max-width:480px){.kpis,.kpis.six{grid-template-columns:1fr}}
@media (max-width:1100px),(max-height:720px){.filterbar{position:static}}
.foot-note{color:var(--muted);font-size:11.5px;text-align:center;padding:10px 0 26px}

/* ---- print (Ctrl+P on the dashboard itself) ---- */
@media print{
  body{background:#fff}.filterbar,.tabs,.subnav,.gtools,.pager,.topbar .pill,.foot-note{display:none!important}
  .card,.kpi{box-shadow:none;break-inside:avoid}.panel:not(.on){display:none!important}
  .topbar{background:#fff!important;color:#000!important;border-bottom:2px solid #0a2f6c}
}
</style>
</head>

<body>
<!-- ============ 2. HTML SHELL ============ -->
<header class="topbar">
  <div class="wrap">
    <div class="logo" id="logo"></div>
    <div>
      <h1 id="appTitle">C&amp;F Management Dashboard</h1>
      <div class="sub" id="coName"></div>
    </div>
    <div class="sp"></div>
    <div class="pill" id="clock"></div>
    <div class="pill">Welcome, admin</div>
  </div>
</header>

<div class="filterbar">
  <div class="wrap">
    <div class="fcard" id="filters">
      <div class="ftitle" id="ftitle"></div>
      <div class="f date"><label for="fFrom">From</label><input type="date" id="fFrom"></div>
      <div class="f date"><label for="fTo">To</label><input type="date" id="fTo"></div>
      <div class="f"><label for="fRange">Quick range</label><select id="fRange"></select></div>
      <div class="f" data-scope="all"><label for="fBranch">Branch</label><select id="fBranch"></select></div>
      <div class="f" data-scope="cnf"><label for="fMode">Shipment Mode</label><select id="fMode"></select></div>
      <div class="f" data-scope="cnf"><label for="fPort">Port</label><select id="fPort"></select></div>
      <div class="f" data-scope="cnf"><label for="fCust">Customer</label><select id="fCust"></select></div>
      <div class="f" data-scope="cnf"><label for="fStatus">Job Status</label><select id="fStatus"></select></div>
      <div class="fbtns">
        <button class="btn ghost" id="btnReset" title="Reset all filters"></button>
        <div class="menu" id="expMenu">
          <button class="btn green" id="btnExport"></button>
          <div class="pop">
            <button data-x="preview" id="xPreview"></button>
            <button data-x="pdf" id="xPdf"></button>
            <button data-x="excel" id="xExcel"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" id="tabs"></nav>

  <!-- Overview -->
  <section class="panel" id="p-overview"></section>
  <!-- Job status -->
  <section class="panel" id="p-jobs"></section>
  <!-- Bill entry -->
  <section class="panel" id="p-bills"></section>
  <!-- GP analysis -->
  <section class="panel" id="p-gp"></section>
  <!-- Job-number-wise reconcile (actual) -->
  <section class="panel" id="p-recon"></section>
  <!-- Accounts -->
  <section class="panel" id="p-accounts"></section>

  <div class="foot-note" id="footNote"></div>
</main>

/* =====================================================================
   3.5 DATA SERVICE
   Everything below generates SAMPLE DATA so the dashboard runs stand-alone.
   To connect your ERP: replace buildCnfData() / buildLedger() with fetch() calls
   that return the same shapes:
     JOBS  [{jobNo,date,mode,port,branch,cust,status,invNo,invVal,material,lcNo,hawb,mawb,beNo,beDate,docRec,docStatus,eta,delivery,remarks}]
     BILLS [{billNo,jobNo,date,mode,port,branch,cust,status,material,qty,unit,weight,rec,nonRec,transport,comm,total,ded,net,collected,due,
             costRec,costNonRec,costTrans}]
     REQS  [{reqNo,date,jobNo,branch,mode,port,cust,status,purpose,amount}]
     LEDGER per branch: signed opening balance + monthly debit/credit per account code (see genBranchLedger)
   ===================================================================== */
let JOBS=[],BILLS=[],REQS=[];
function buildCnfData(){
  const rng=mulberry32(CONFIG.seed), R=(a,b)=>a+(b-a)*rng(), RI=(a,b)=>Math.floor(R(a,b+1));
  const pickW=(items,w)=>{let t=w.reduce((a,b)=>a+b,0)*rng();for(let i=0;i<items.length;i++){t-=w[i];if(t<=0)return items[i];}return items[items.length-1];};
  const pick=a=>a[Math.floor(rng()*a.length)];
  const custW=CUSTOMERS.map((_,i)=>1/Math.pow(i+1,.75));
  const modeW=[.30,.12,.17,.25,.08,.08];
  const t0=dn(CONFIG.defaultFrom), tEnd=dn(CONFIG.dataEnd), today=tEnd;
  const portsFor=m=>m.startsWith('Air')?[PORTS[0]]:m.startsWith('Sea')?[PORTS[1],PORTS[2],PORTS[3]]:[PORTS[4],PORTS[5]];
  const portW=m=>m.startsWith('Air')?[1]:m.startsWith('Sea')?[.62,.2,.18]:[.62,.38];
  const IMP=['OUTSOLE, FABRICS & HANG TAG','OUTSOLE, FABRICS, STICKER & SHOE LACE','FABRICS & STICKER','OUTSOLE, MIDSOLE, STICKER','SEMI FINISHED UPPER, FABRICS & MIDSOLE','PU, FABRICS & LABEL','FINISHING AGENT','YARN & ACCESSORIES','MACHINERY SPARE PARTS','RAW HIDES & CHEMICALS','PACKING MATERIALS','ZIPPER, BUTTON & LABEL'];
  const DEST=['ANTWERP','HAMBURG','LONDON','NEW YORK','ROTTERDAM','SYDNEY','TORONTO','TOKYO'];
  const REMARK=['Awaiting NOC','Under assessment','Examination pending','Duty payment pending','Delivery order issued','Awaiting vessel berthing','Customs hold – query raised'];
  const PURPOSE=['Port dues','Customs duty & VAT','Transport hire','Labour & handling','Documentation fee','Examination charge','Shipping line D/O'];

  // 1) jobs
  const tmp=[];
  for(let i=0;i<CONFIG.jobsCount;i++){
    let d=t0+Math.floor(Math.pow(rng(),.92)*(tEnd-t0+1));
    if(new Date(d*864e5).getUTCDay()===5) d=Math.min(tEnd,d+1);          // Friday = weekend
    const mode=pickW(MODES,modeW), ports=portsFor(mode), port=pickW(ports,portW(mode)), c=pickW(CUSTOMERS,custW);
    tmp.push({d,mode,port,c});
  }
  tmp.sort((a,b)=>a.d-b.d);
  tmp.forEach((t,i)=>{
    const seq=String(i+1).padStart(6,'0'), date=iso(t.d), age=today-t.d, imp=t.mode.includes('Import'), air=t.mode.startsWith('Air');
    const jobNo=`${MODE_CODE[t.mode]}/${t.port.code}_${t.c[1]}_26_${seq}`;
    // status by age
    const r=rng(); let status;
    if(age<=6 && r<.14) status='Pending';
    else if(r<Math.min(.97,.12+age/55)) status='Delivered'; else status='In Transit';
    const qty=imp?+R(8,260).toFixed(2):RI(40,9000), unit=imp?(rng()<.5?'Pcs':'Kg'):'Pair', weight=+(qty*R(.6,2.2)).toFixed(2);
    const material=imp?`${qty.toFixed(2)} ${pick(IMP)}`:`${qty} Pair (${weight} KG) EXPORTED FROM ${t.port.short} TO ${pick(DEST)}`;
    const delivery=status==='Delivered'?addDays(date,RI(4,17)):'';
    const dl=delivery&&delivery>CONFIG.dataEnd?CONFIG.dataEnd:delivery;
    const incompleteDocs=status==='Pending'||(status==='In Transit'&&rng()<.08);
    const job={jobNo,seq:i+1,date,mode:t.mode,port:t.port.id,portName:t.port.name,branch:t.port.branch,cust:t.c[0],custCode:t.c[1],status,
      invNo:`CYT26${String(RI(600,1299))}-${RI(1,40)}`,invVal:+(imp?R(900,12500):R(6000,68000)).toFixed(2),
      material,qty,unit,weight,lcNo:String(1475260500000+RI(0,99999)),hawb:air&&rng()<.5?`921-${RI(60000000,69999999)}`:'',mawb:air?`${pick(['784','619','921','997'])}-${RI(10000000,99999999)}`:'',
      beNo:status==='Pending'?'':`C-${RI(700000,899999)}`,beDate:status==='Pending'?'':addDays(date,RI(0,5)),
      docRec:addDays(date,-RI(1,8)),docStatus:incompleteDocs?'Incomplete':'Complete',
      eta:status==='In Transit'?addDays(CONFIG.dataEnd,RI(-3,10)):'',delivery:dl,
      remarks:status==='In Transit'&&rng()<.55?pick(REMARK):''};
    JOBS.push(job);
  });
  // 2) bills (1 per billed job)
  const modeF={'Air Import':.8,'Air Export':.9,'Sea Import':1.15,'Sea Export':1.6,'Land Import':.9,'Land Export':1.0};
  JOBS.forEach(j=>{
    if(j.status==='Pending')return;
    const bd=addDays(j.date,RI(2,9)); if(bd>CONFIG.dataEnd)return;
    const base=Math.exp(Math.log(13500)+R(-.85,.95)*0.95)*modeF[j.mode];
    const comm=Math.round(Math.max(2000,base*R(.22,.4))), rec=Math.round(base*R(.35,.62)), nonRec=Math.round(pick([1300,1700,2700,2700,3200,5700,8700,10700,11700])*R(.9,1.15));
    const transport=(j.mode.startsWith('Sea')||j.mode.startsWith('Land'))&&rng()<.3?Math.round(R(5000,21000)):(rng()<.12?Math.round(R(3000,8000)):0);
    const total=rec+nonRec+transport+comm, ded=rng()<.07?Math.round(total*R(.01,.04)):0, net=total-ded;
    const age=today-dn(bd), pPaid=Math.min(.95,.22+age/62), r=rng();
    const collected=r<pPaid?net:(r<pPaid+.12?Math.round(net*R(.3,.7)):0);
    BILLS.push({billNo:j.jobNo,jobNo:j.jobNo,date:bd,mode:j.mode,port:j.port,branch:j.branch,cust:j.cust,status:j.status,material:j.material,qty:j.qty,unit:j.unit,weight:j.weight,
      rec,nonRec,transport,comm,total,ded,net,collected,due:net-collected,
      costRec:Math.round(rec*R(.36,.6)),costNonRec:Math.round(nonRec*R(.72,.95)),costTrans:transport?Math.round(transport*R(.85,1)):0});
  });
  BILLS.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.billNo<b.billNo?-1:1);
  // 3) operational-fund requisitions
  JOBS.forEach((j,i)=>{
    if(rng()>.42)return;
    const d=addDays(j.date,RI(0,2)), age=today-dn(d), r=rng();
    REQS.push({reqNo:'REQ-26-'+String(REQS.length+1).padStart(5,'0'),date:d,jobNo:j.jobNo,branch:j.branch,mode:j.mode,port:j.port,cust:j.cust,
      status:r<Math.min(.2,.03+.4/(age+1))?'Pending':r>.96?'Rejected':'Approved',purpose:pick(PURPOSE),amount:Math.round(R(6000,140000)/100)*100});
  });
}

/* =====================================================================
   3.6 ACCOUNTS ENGINE  (Chart of Accounts tree + sample ledger)
   ===================================================================== */
const NODES=[],LEAVES=[],NODE_BY_CODE={},LV3={},LV4={};
(function buildTree(){
  const parse=s=>{const m=/^\s*(\d+)\s*-\s*(.*)$/.exec(s);return m?{code:m[1],name:m[2].trim()}:{code:'',name:String(s).trim()};};
  const add=(level,label,parent)=>{const p=parse(label);const n={id:NODES.length,level,code:p.code,name:p.name,parent,kids:[]};NODES.push(n);if(parent!=null)NODES[parent].kids.push(n.id);if(level<5)NODE_BY_CODE[p.code]=n;return n;};
  COA.forEach(([l1,c2])=>{const n1=add(1,l1,null);c2.forEach(([l2,c3])=>{const n2=add(2,l2,n1.id);c3.forEach(([l3,c4])=>{const n3=add(3,l3,n2.id);c4.forEach(([l4,lv])=>{const n4=add(4,l4,n3.id);
    lv.forEach(([code,head])=>{const n5={id:NODES.length,level:5,code:String(code),name:head,parent:n4.id,kids:[]};NODES.push(n5);n4.kids.push(n5.id);
      const lf={i:LEAVES.length,id:n5.id,code:String(code),name:head,cat:+n1.code,l2:n2.code,l3:n3.code,l4:n4.code,anc:[n1.id,n2.id,n3.id,n4.id,n5.id]};
      LEAVES.push(lf);(LV3[n3.code]||(LV3[n3.code]=[])).push(lf);(LV4[n4.code]||(LV4[n4.code]=[])).push(lf);});});});});});
  NODES.forEach(n=>{if(!n.name&&n.kids.length)n.name=NODES[n.kids[0]].name;});   // blank 3rd-layer names borrow the first child name
})();
const NL=LEAVES.length;
const MONTHS=monthsBetween(CONFIG.fyStart.slice(0,7),CONFIG.dataEnd.slice(0,7));
const CASH_BANK_OWNER={ // cash / bank account code -> branch id
  '1020040000100001':'HO','1020040000100002':'PNG','1020040000100003':'BNP','1020040000100004':'CML','1020040000200001':'HO',
  '1020040000300001':'HO','1020040000300005':'HO','1020040000300012':'HO','1020040000300008':'CTG','1020040000300009':'CTG','1020040000300010':'PNG','1020040000300011':'BNP'};
const LEAD={HO:'1020040000300001',CTG:'1020040000300008',PNG:'1020040000300010',BNP:'1020040000300011',CML:'1020040000100004'};
const LEAF_BY_CODE={};LEAVES.forEach(l=>LEAF_BY_CODE[l.code]=l);
const CAP_LEAF=LV4['20100100001'][0], RE_LEAF=LV4['20100200001'][0];
const IS_CASH=l=>l.l4==='10200400001'||l.l4==='10200400002', IS_BANK=l=>l.l4==='10200400003';
const LED={};   // LED[branchId] = {open:Float64Array, dr:[Float64Array per month], cr:[...]}

function buildLedger(){
  // actual monthly revenue / direct cost per branch from sample bills (import vs export)
  const bm={};BRANCHES.forEach(b=>{bm[b.id]={};});
  BILLS.forEach(x=>{const m=x.date.slice(0,7);const o=bm[x.branch][m]||(bm[x.branch][m]={ri:0,re:0,ci:0,ce:0});
    const imp=x.mode.includes('Import');const cost=x.costRec+x.costNonRec+x.costTrans;
    if(imp){o.ri+=x.net;o.ci+=cost;}else{o.re+=x.net;o.ce+=cost;}});
  BRANCHES.forEach((B,bi)=>{
    const full=['2026-08','2026-09','2026-10'].map(m=>bm[B.id][m]||{ri:0,re:0,ci:0,ce:0});
    const avg={ri:sum(full,x=>x.ri)/3,re:sum(full,x=>x.re)/3,ci:sum(full,x=>x.ci)/3,ce:sum(full,x=>x.ce)/3};
    MONTHS.forEach((m,mi)=>{if(!['2026-08','2026-09','2026-10'].includes(m)){const f=m==='2026-07'?.9:1.02;bm[B.id][m]={ri:avg.ri*f,re:avg.re*f,ci:avg.ci*f,ce:avg.ce*f};}});
    LED[B.id]=genBranchLedger(B,bi,bm[B.id]);
  });
}
function genBranchLedger(B,bi,bm){
  const rng=mulberry32(CONFIG.seed+977*(bi+1)), R=(a,b)=>a+(b-a)*rng(), w=B.w;
  const open=new Float64Array(NL), dr=MONTHS.map(()=>new Float64Array(NL)), cr=MONTHS.map(()=>new Float64Array(NL));
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const act=(code,k)=>shuffle(LV3[code]||[]).slice(0,k), L3=c=>LV3[c]||[];
  const put=(arr,leaves,total)=>{total=Math.round(total);if(total<=0||!leaves.length)return;const ws=leaves.map(()=>.2+rng()),s=ws.reduce((a,b)=>a+b,0);let used=0;
    leaves.forEach((lf,i)=>{const v=i===leaves.length-1?total-used:Math.floor(total*ws[i]/s);arr[lf.i]+=v;used+=v;});};
  const G={ar:act('102001',24),ic:act('102002',3),adv:act('102003',10),ap:act('301001',0),tp:act('203001',14),ic2:act('203002',3),op:act('203003',5),pe:act('203006',8),tds:act('203009',2),
    rI:L3('401001'),rE:L3('401002'),dI:act('301001',26),dE:act('301002',14)};
  // ---- opening balances (FY start)
  L3('101001').forEach(l=>{open[l.i]=Math.round(R(15e3,420e3)*w*1.8);}); L3('101002').forEach(l=>{open[l.i]=Math.round(246750*w*2);});
  G.ar.forEach(l=>{open[l.i]=Math.round(R(60e3,520e3)*w*1.6);}); G.ic.forEach(l=>{open[l.i]=Math.round(R(50e3,300e3)*w);}); G.adv.forEach(l=>{open[l.i]=Math.round(R(20e3,300e3)*w);});
  G.tp.forEach(l=>{open[l.i]=-Math.round(R(80e3,500e3)*w);}); G.ic2.forEach(l=>{open[l.i]=-Math.round(R(30e3,200e3)*w);}); G.op.forEach(l=>{open[l.i]=-Math.round(R(20e3,150e3)*w);});
  G.pe.forEach(l=>{open[l.i]=-Math.round(R(30e3,200e3)*w);}); G.tds.forEach(l=>{open[l.i]=-Math.round(R(10e3,60e3)*w);});
  const loan=L3('203004')[0]; if(loan)open[loan.i]=-Math.round(1.8e6*w*2); open[L3('202001')[0].i]=-Math.round(400e3*w);
  const mine=LEAVES.filter(l=>CASH_BANK_OWNER[l.code]===B.id);
  mine.forEach(l=>{open[l.i]=IS_BANK(l)?Math.round(R(1.5e6,5e6)):Math.round(R(40e3,260e3));});
  // ---- monthly activity
  const IND={'302001':.38,'302002':.015,'302003':.01,'302004':.12,'302005':.02,'302006':.05,'302007':.02,'302008':.03,'302009':.015,'302010':.03,'302011':.05,'302012':.02,'302013':.01,'302014':.015,'302017':.06,'302018':.015,'302019':.005};
  const indSum=Object.values(IND).reduce((a,b)=>a+b,0), indLeaves={};Object.keys(IND).forEach(c=>indLeaves[c]=act(c,6));
  const gAssets=act('102003',10);
  const ref=Math.max(1,sum(MONTHS,m=>bm[m].ri+bm[m].re)/MONTHS.length);
  MONTHS.forEach((m,mi)=>{
    const o=bm[m], D=dr[mi], C=cr[mi], rev=o.ri+o.re, cost=o.ci+o.ce, base=Math.max(rev,ref*.5);
    put(C,G.rI,o.ri);put(C,G.rE,o.re);put(D,G.dI,o.ci);put(D,G.dE,o.ce);
    let ind=0;Object.keys(IND).forEach(c=>{const v=base*.27*(IND[c]/indSum)*R(.9,1.1);ind+=v;put(D,indLeaves[c],v);});
    const fin=rev*.012, nonop=rev*.01, tax=Math.max(0,(rev-cost-ind-fin+nonop))*.05;
    put(D,L3('303001'),rev*.008);put(D,L3('303002'),rev*.004);put(C,L3('402001'),rev*.006);put(C,L3('402002'),rev*.004);
    put(D,L3('304001'),tax);put(C,L3('203005'),tax);
    put(D,G.ar,rev);put(C,G.ar,rev*R(.9,.98));                       // trade receivable: billed / collected
    put(C,G.tp,cost);put(D,G.tp,cost*R(.82,.95));                    // trade payable: accrued / paid
    put(C,G.pe,ind*.18);put(D,G.pe,ind*.15);put(C,G.op,rev*.015);put(D,G.op,rev*.012);
    put(C,G.tds,rev*.008);put(D,G.tds,rev*.006);put(D,G.adv,rev*.02);put(C,G.adv,rev*.016);
    put(D,G.ic,rev*.01);put(C,G.ic,rev*.009);put(C,G.ic2,rev*.008);put(D,G.ic2,rev*.007);
    if(mi===2)put(D,L3('101001').slice(0,6),R(120e3,380e3)*w*2);    // small asset purchase
    mine.forEach(l=>{if(IS_BANK(l)){const x=R(.8e6,3e6);D[l.i]+=Math.round(x);C[l.i]+=Math.round(x*R(.7,.98));}else{const x=R(1e5,4e5);D[l.i]+=Math.round(x);C[l.i]+=Math.round(x*R(.8,.99));}});
    // balancing entry through the branch's main bank / cash account
    let net=0;for(let i=0;i<NL;i++)net+=D[i]-C[i];
    const lead=LEAF_BY_CODE[LEAD[B.id]];if(net>0)C[lead.i]+=net;else D[lead.i]+=-net;
  });
  // keep main bank positive
  const lead=LEAF_BY_CODE[LEAD[B.id]];let bal=open[lead.i],mn=bal;MONTHS.forEach((_,mi)=>{bal+=dr[mi][lead.i]-cr[mi][lead.i];mn=Math.min(mn,bal);});
  if(mn<250e3)open[lead.i]+=Math.round(250e3-mn);
  // equity balances the opening position
  let X=0;for(let i=0;i<NL;i++)X+=open[i];X=Math.round(X);
  const sc=Math.round(X*.75);open[CAP_LEAF.i]=-sc;open[RE_LEAF.i]=-(X-sc);
  return {open,dr,cr};
}

/** Core: opening / transactions / closing per account for [from,to] and a branch ('' = all) */
function overlapDays(a0,a1,b0,b1){return Math.max(0,Math.min(a1,b1)-Math.max(a0,b0)+1);}
const _lcache={};
function computeLedger(from,to,branch){

  if(to<from)to=from;
  const fy=dn(CONFIG.fyStart), f0=dn(from), t0=dn(to);
  const op=new Float64Array(NL),trDr=new Float64Array(NL),trCr=new Float64Array(NL);
  BRANCHES.filter(b=>!branch||b.id===branch).forEach(b=>{
    const L=LED[b.id];
    for(let i=0;i<NL;i++)op[i]+=L.open[i];
    MONTHS.forEach((m,mi)=>{
      const ms=dn(m+'-01'),D=daysIn(m),me=ms+D-1;
      const fp=overlapDays(ms,me,f0,t0)/D, fq=overlapDays(ms,me,fy,f0-1)/D;
      if(!fp&&!fq)return;
      const d=L.dr[mi],c=L.cr[mi];
      for(let i=0;i<NL;i++){const a=d[i],z=c[i];if(!a&&!z)continue;
        if(fp){trDr[i]+=fp===1?a:Math.round(a*fp);trCr[i]+=fp===1?z:Math.round(z*fp);}
        if(fq){op[i]+=(fq===1?a:Math.round(a*fq))-(fq===1?z:Math.round(z*fq));}}

  let so=0,st=0;for(let i=0;i<NL;i++){so+=op[i];st+=trDr[i]-trCr[i];}
  op[CAP_LEAF.i]-=Math.round(so);
  const pl=LEAF_BY_CODE[LEAD.HO].i;st=Math.round(st);if(st>0)trCr[pl]+=st;else trDr[pl]+=-st;
  const cl=new Float64Array(NL);for(let i=0;i<NL;i++)cl[i]=op[i]+trDr[i]-trCr[i];
  return _lcache[key]={op,trDr,trCr,cl};
}
const netOf=(L,arr,pred)=>{let s=0;LEAVES.forEach(l=>{if(pred(l))s+=arr[l.i];});return s;};

/** Trial balance rows (tree) */
function trialBalance(L,maxLevel,hideZero){
  const n=NODES.length,A={opDr:new Float64Array(n),opCr:new Float64Array(n),trDr:new Float64Array(n),trCr:new Float64Array(n),clDr:new Float64Array(n),clCr:new Float64Array(n)};
  LEAVES.forEach(l=>{const o=L.op[l.i],c=L.cl[l.i];const v={opDr:o>0?o:0,opCr:o<0?-o:0,trDr:L.trDr[l.i],trCr:L.trCr[l.i],clDr:c>0?c:0,clCr:c<0?-c:0};
    l.anc.forEach(id=>{for(const k in v)A[k][id]+=v[k];});});
  const rows=[];NODES.forEach(nd=>{if(nd.level>maxLevel)return;
    const r={level:nd.level,code:nd.code,name:nd.name};for(const k in A)r[k]=A[k][nd.id];
    if(hideZero&&!(r.opDr||r.opCr||r.trDr||r.trCr||r.clDr||r.clCr))return;rows.push(r);});
  const root={};for(const k in A)root[k]=sum(NODES.filter(x=>x.level===1),x=>A[k][x.id]);

}
const l3sum=(arr,codes,sign=1)=>codes.reduce((s,c)=>s+sign*sum(LV3[c]||[],l=>arr[l.i]),0);
const nameOf=c=>(NODE_BY_CODE[c]||{}).name||c;

/** Income statement from period transactions */
function incomeStatement(L){
  const rev=c=>sum(LV3[c]||[],l=>L.trCr[l.i]-L.trDr[l.i]), exp=c=>sum(LV3[c]||[],l=>L.trDr[l.i]-L.trCr[l.i]);
  const l3in=l2=>NODES.filter(n=>n.level===3&&n.code.startsWith(l2)).map(n=>n.code);
  const opRev=l3in('401'),nonOp=l3in('402'),direct=l3in('301'),indirect=l3in('302'),fin=l3in('303'),tax=l3in('304');
  const sumRev=cs=>cs.reduce((s,c)=>s+rev(c),0), sumExp=cs=>cs.reduce((s,c)=>s+exp(c),0);
  const T={opRev:sumRev(opRev),nonOp:sumRev(nonOp),direct:sumExp(direct),indirect:sumExp(indirect),fin:sumExp(fin),tax:sumExp(tax)};
  T.revenue=T.opRev+T.nonOp;T.gp=T.opRev-T.direct;T.pbt=T.revenue-T.direct-T.indirect-T.fin;T.np=T.pbt-T.tax;
  const rows=[];const P=v=>T.revenue?v/T.revenue*100:0;
  const head=l=>rows.push({label:l,kind:'head'});
  const item=(c,f)=>{const v=f(c);rows.push({label:c+' – '+nameOf(c),amt:v,pct:P(v),kind:'item'});};
  const sub=(l,v,k='sub')=>rows.push({label:l,amt:v,pct:P(v),kind:k});
  head('REVENUE');opRev.forEach(c=>item(c,rev));sub('Operating Income',T.opRev);nonOp.forEach(c=>item(c,rev));sub('Total Revenue',T.revenue,'total');
  head('DIRECT EXPENSES');direct.forEach(c=>item(c,exp));sub('Total Direct Expenses',T.direct);
  sub('GROSS PROFIT',T.gp,'total');
  head('INDIRECT EXPENSES');indirect.forEach(c=>item(c,exp));sub('Total Indirect Expenses',T.indirect);
  head('FINANCE COST');fin.forEach(c=>item(c,exp));sub('Total Finance Cost',T.fin);
  sub('PROFIT BEFORE TAX',T.pbt,'total');
  head('INCOME TAX');tax.forEach(c=>item(c,exp));
  sub('NET PROFIT / (LOSS)',T.np,'total');
  return {T,rows,detail:{direct:direct.map(c=>[nameOf(c),exp(c)]),indirect:indirect.map(c=>[nameOf(c),exp(c)]),fin:fin.map(c=>[nameOf(c),exp(c)])}};
}

/** Balance sheet at closing date */
function balanceSheet(L){
  const as=c=>sum(LV3[c]||[],l=>L.cl[l.i]), li=c=>-as(c);
  const l3in=p=>NODES.filter(n=>n.level===3&&n.code.startsWith(p)).map(n=>n.code);
  const profit=-sum(LEAVES.filter(l=>l.cat>=3),l=>L.cl[l.i]);
  const nca=l3in('101'),ca=l3in('102'),eq=l3in('201'),ncl=l3in('202'),cl=l3in('203');
  const S=(cs,f)=>cs.reduce((s,c)=>s+f(c),0);
  const T={nca:S(nca,as),ca:S(ca,as),eq:S(eq,li)+profit,ncl:S(ncl,li),cl:S(cl,li),profit};
  T.assets=T.nca+T.ca;T.liab=T.ncl+T.cl;T.total=T.eq+T.liab;
  T.cash=sum(LEAVES.filter(IS_CASH),l=>L.cl[l.i]);T.bank=sum(LEAVES.filter(IS_BANK),l=>L.cl[l.i]);
  T.ar=as('102001');T.ap=li('203001');
  const rows=[],P=v=>T.assets?v/T.assets*100:0;
  const head=l=>rows.push({label:l,kind:'head'}),item=(l,v)=>rows.push({label:l,amt:v,pct:P(v),kind:'item'}),sub=(l,v,k='sub')=>rows.push({label:l,amt:v,pct:P(v),kind:k});
  head('ASSETS');head('Non-Current Assets');nca.forEach(c=>item(c+' – '+nameOf(c),as(c)));sub('Total Non-Current Assets',T.nca);
  head('Current Assets');ca.forEach(c=>item(c+' – '+nameOf(c),as(c)));sub('Total Current Assets',T.ca);sub('TOTAL ASSETS',T.assets,'total');
  head('EQUITY & LIABILITIES');head('Equity');eq.forEach(c=>item(c+' – '+nameOf(c),li(c)));item('Current Period Profit / (Loss)',profit);sub('Total Equity',T.eq);
  head('Non-Current Liabilities');ncl.forEach(c=>item(c+' – '+nameOf(c),li(c)));sub('Total Non-Current Liabilities',T.ncl);
  head('Current Liabilities');cl.forEach(c=>item(c+' – '+nameOf(c),li(c)));sub('Total Current Liabilities',T.cl);sub('TOTAL EQUITY & LIABILITIES',T.total,'total');
  return {T,rows,assetsParts:[...nca,...ca].map(c=>[nameOf(c),as(c)]).filter(x=>Math.abs(x[1])>0),
    lePart:[['Equity (incl. profit)',T.eq],['Non-current liabilities',T.ncl],...cl.map(c=>[nameOf(c),li(c)])].filter(x=>x[1]>0)};
}

const DEF=()=>({from:CONFIG.defaultFrom,to:CONFIG.dataEnd,branch:'',mode:'',port:'',cust:'',status:''});

const jobOK=j=>(!F.mode||j.mode===F.mode)&&(!F.port||j.port===F.port)&&(!F.cust||j.cust===F.cust)&&(!F.branch||j.branch===F.branch)&&(!F.status||j.status===F.status);
const inRange=d=>d>=F.from&&d<=F.to;
function buildView(){

  const bills=BILLS.filter(b=>inRange(b.date)&&jobOK(b));
  const reqs=REQS.filter(r=>inRange(r.date)&&(!F.branch||r.branch===F.branch)&&(!F.mode||r.mode===F.mode)&&(!F.port||r.port===F.port)&&(!F.cust||r.cust===F.cust));
  const cnt=s=>jobs.filter(j=>j.status===s).length;
  const B={n:bills.length,net:sum(bills,b=>b.net),due:sum(bills,b=>b.due),col:sum(bills,b=>b.collected),rec:sum(bills,b=>b.rec),nonRec:sum(bills,b=>b.nonRec),
    transport:sum(bills,b=>b.transport),comm:sum(bills,b=>b.comm),ded:sum(bills,b=>b.ded),total:sum(bills,b=>b.total),
    costRec:sum(bills,b=>b.costRec),costNonRec:sum(bills,b=>b.costNonRec),costTrans:sum(bills,b=>b.costTrans)};
  B.cost=B.costRec+B.costNonRec+B.costTrans;B.profit=B.net-B.cost;B.gp=B.net?B.profit/B.net*100:0;
  B.last=bills.length?bills[bills.length-1]:null;
  const deliv=jobs.filter(j=>j.status==='Delivered'&&j.delivery);
  const J={total:jobs.length,pending:cnt('Pending'),transit:cnt('In Transit'),delivered:cnt('Delivered'),
    avgDays:deliv.length?sum(deliv,j=>dn(j.delivery)-dn(j.date))/deliv.length:0,
    onTime:deliv.length?deliv.filter(j=>dn(j.delivery)-dn(j.date)<=CONFIG.onTimeDays).length/deliv.length*100:0,
    docsPending:jobs.filter(j=>j.docStatus!=='Complete').length,
    arrivals:jobs.filter(j=>j.status==='In Transit'&&j.eta>=CONFIG.dataEnd&&j.eta<=addDays(CONFIG.dataEnd,7))};
  const Q={n:reqs.length,pendingAmt:sum(reqs.filter(r=>r.status==='Pending'),r=>r.amount),pendingN:reqs.filter(r=>r.status==='Pending').length};

}

function fmtCell(c,r,i,forExport){

  const v=c.v?c.v(r):r[c.k];
  switch(c.t){case'int':return int(v);case'money':return v||v===0?(v===0&&!forExport?'–':money(v)):'';case'amt':return v===0&&!forExport?'–':amt(v);
    case'pct':return pct(v,2);case'date':return dmy(v);default:return String(v??'');}
}
const isNum=c=>['int','money','amt','pct'].includes(c.t);
class Grid{
  constructor(id,o){
    this.id=id;this.o=Object.assign({sizes:[10,15,25],size:10,search:true,sortable:true,card:'g760'},o);this.cols=o.columns;this.rows=[];this.view=[];this.page=1;this.size=this.o.size;this.sk=null;this.sd=1;this.q='';this.total=null;
    const sz=$('#'+id+'_sz');sz.innerHTML=this.o.sizes.map(s=>`<option ${s===this.size?'selected':''}>${s}</option>`).join('');
    sz.onchange=()=>{this.size=+sz.value;this.page=1;this.render();};
    const q=$('#'+id+'_q');if(!this.o.search)q.style.display='none';else q.oninput=()=>{this.q=q.value.trim().toLowerCase();this.page=1;this.apply();};
    $('#'+id).addEventListener('click',e=>{const th=e.target.closest('th.sortable');if(!th)return;const k=+th.dataset.i;this.sd=this.sk===k?-this.sd:1;this.sk=k;this.apply();});
    $('#'+id+'_f').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b||b.disabled)return;this.page=+b.dataset.p;this.render();});
    GRIDS[id]=this;
  }
  setRows(rows,totalAll){this.rows=rows;this.total=totalAll;this.page=1;this.apply();}
  apply(){let v=this.rows;
    if(this.q)v=v.filter(r=>this.cols.some(c=>c.t!=='sn'&&fmtCell(c,r,0).toLowerCase().includes(this.q)));
    if(this.sk!==null){const c=this.cols[this.sk];const g=r=>c.s?c.s(r):(c.v?c.v(r):r[c.k]);v=[...v].sort((a,b)=>{const x=g(a),y=g(b);return(x<y?-1:x>y?1:0)*this.sd;});}
    this.view=v;this.render();}
  render(){

    const s=(this.page-1)*this.size,slice=this.view.slice(s,s+this.size);

    h+='<tr>'+this.cols.map((c,i)=>{const sortable=o.sortable&&c.t!=='sn'&&!c.nosort;return`<th class="${sortable?'sortable':''} ${this.sk===i?(this.sd>0?'asc':'desc'):''} ${c.hide?'h-'+c.hide:''}" data-i="${i}" ${c.w?`style="width:${c.w}"`:''}>${c.l}${sortable?'<span class="si">⇅</span>':''}</th>`;}).join('')+'</tr></thead><tbody>';
    if(!slice.length)h+=`<tr class="empty-row"><td colspan="${this.cols.length}">No records match the selected filters.</td></tr>`;
    slice.forEach((r,i)=>{h+=`<tr class="${o.rowCls?o.rowCls(r):''}">`+this.cols.map(c=>{
      let content;if(c.r)content=c.r(r,s+i);else if(c.t==='badge')content=`<span class="badge s-${slug(r[c.k])}">${esc(r[c.k])}</span>`;else content=esc(fmtCell(c,r,s+i));
      return`<td class="${cls(c)}" data-l="${esc(c.l.replace(/<[^>]+>/g,''))}">${content}</td>`;}).join('')+'</tr>';});
    h+='</tbody>';
    if(o.totals&&n){h+='<tfoot><tr>'+this.cols.map((c,i)=>{let t='';if(i===this.cols.findIndex(x=>x.t!=='sn'))t='Total';if(c.tot)t=c.t==='pct'?'':(c.t==='int'?int(sum(this.view,r=>c.v?c.v(r):r[c.k])):amt(sum(this.view,r=>c.v?c.v(r):r[c.k])));if(c.totf)t=c.totf(this.view);
      return`<td class="${cls(c)}">${t}</td>`;}).join('')+'</tr></tfoot>';}
    h+='</table>';$('#'+this.id).innerHTML=h;
    // footer
    const from=n?s+1:0,to=Math.min(n,s+this.size);
    let f=`<div>Showing ${int(from)} to ${int(to)} of ${int(n)} entries${this.total!=null&&this.total!==n?` (filtered from ${int(this.total)} total entries)`:''}</div><div class="pager">`;
    const btn=(p,l,dis,on)=>`<button data-p="${p}" ${dis?'disabled':''} class="${on?'on':''}" aria-label="page ${p}">${l}</button>`;
    f+=btn(1,'«',this.page===1)+btn(this.page-1,'‹',this.page===1);
    const P=this.page,nums=pages<=7?[...Array(pages)].map((_,i)=>i+1):P<=4?[1,2,3,4,5,'…',pages]:P>=pages-3?[1,'…',pages-4,pages-3,pages-2,pages-1,pages]:[1,'…',P-1,P,P+1,'…',pages];
    nums.forEach(x=>f+=x==='…'?'<span class="dots">…</span>':btn(x,x,false,x===P));
    f+=btn(this.page+1,'›',this.page===pages)+btn(pages,'»',this.page===pages)+'</div>';
    $('#'+this.id+'_f').innerHTML=f;
  }
}

/* ----- helpers for monthly series ----- */
function monthKeys(){return monthsBetween(F.from.slice(0,7),F.to.slice(0,7));}
function monthlyBills(f){const ks=monthKeys(),g=groupBy(V.bills,b=>b.date.slice(0,7));return ks.map(k=>f(g.get(k)||[]));}
const topN=(arr,keyf,valf,n=7)=>{const g=groupBy(arr,keyf);return[...g.entries()].map(([k,v])=>[k,sum(v,valf)]).sort((a,b)=>b[1]-a[1]).slice(0,n);};

   <div class="minis">${mini('gm_cnf','blue','C&amp;F Profit')}${mini('gm_tr','purple','Transport Profit')}${mini('gm_best','green','Best Mode (GP%)')}${mini('gm_low','red','Lowest Mode (GP%)')}${mini('gm_avg','sky','Avg Profit / Bill')}</div>

   <div class="row c21">${chartCard('g_ch4','Monthly Revenue, Cost &amp; GP%','')}${chartCard('g_ch5','Top Customers by Gross Profit','')}</div>
   ${gridCard('g_g','GP Analysis Detail')}`;
  const P=r=>r.net-r.costRec-r.costNonRec-r.costTrans;
  new Grid('g_g',{card:'g760',totals:true,groups:[['',3],['Billing',4],['Costing',3],['PNL',4]],columns:[
    {t:'sn',l:'SN',w:'36px',hide:'md'},{k:'date',l:'Billing Date',t:'date',cls:'nw'},{k:'billNo',l:'Bill No',cls:'mono nw'},
    {k:'comm',l:'Comm.',t:'amt',tot:true},{k:'others',l:'Others',t:'amt',tot:true,hide:'md',v:r=>r.net-r.transport-r.comm},{k:'transport',l:'Transport',t:'amt',tot:true},{k:'net',l:'Total Bill',t:'amt',tot:true},
    {k:'cnfCost',l:'C&amp;F Cost',t:'amt',tot:true,hide:'md',v:r=>r.costRec+r.costNonRec},{k:'costTrans',l:'Trans. Cost',t:'amt',tot:true,hide:'md'},{k:'cost',l:'Total Cost',t:'amt',tot:true,v:r=>r.costRec+r.costNonRec+r.costTrans},
    {k:'gpc',l:'C&amp;F GP',t:'amt',tot:true,hide:'md',v:r=>(r.net-r.transport)-(r.costRec+r.costNonRec)},{k:'gpt',l:'Trans. GP',t:'amt',tot:true,hide:'md',v:r=>r.transport-r.costTrans},{k:'gp',l:'Total GP',t:'amt',tot:true,v:P},
    {k:'gpp',l:'GP %',t:'pct',v:r=>r.net?P(r)/r.net*100:0,totf:v=>{const n=sum(v,x=>x.net);return n?pct(sum(v,P)/n*100,2):'0.00%';}}]});
}
function renderGP(){
  const B=V.B,bills=V.bills,P=r=>r.net-r.costRec-r.costNonRec-r.costTrans;
  setK('g_n',int(B.n),'bills in period');setK('g_nbv',cur(B.net),'');setK('g_cost',cur(B.cost),pct(B.net?B.cost/B.net*100:0,1)+' of bill value');setK('g_gp',cur(B.profit),'');setK('g_pct',pct(B.gp,2),'gross margin');
  const cnfP=sum(bills,b=>(b.net-b.transport)-(b.costRec+b.costNonRec)),trP=sum(bills,b=>b.transport-b.costTrans);
  setK('gm_cnf',cur(cnfP));setK('gm_tr',cur(trP));setK('gm_avg',cur(B.n?B.profit/B.n:0));
  const ms=MODES.filter(m=>bills.some(b=>b.mode===m)),gpm=ms.map(m=>{const a=bills.filter(b=>b.mode===m),n=sum(a,b=>b.net);return n?sum(a,P)/n*100:0;});
  if(ms.length){const hi=gpm.indexOf(Math.max(...gpm)),lo=gpm.indexOf(Math.min(...gpm));setK('gm_best',pct(gpm[hi],1),ms[hi]);setK('gm_low',pct(gpm[lo],1),ms[lo]);}else{setK('gm_best','–');setK('gm_low','–');}
  mkChart('g_ch1','doughnut',['C&F Receivable cost','C&F Non-receivable cost','Transport cost'],[pieDs([B.costRec,B.costNonRec,B.costTrans])],{money:true,center:{text:compact(B.cost),sub:'total cost'}});
  mkChart('g_ch2','bar',ms,[barDs('GP %',gpm,gpm.map(v=>v>=50?cssVar('--green'):cssVar('--orange')))],{legend:false,afmt:v=>v+'%',tfmt:v=>pct(v,2)});
  mkChart('g_ch3','bar',['C&F','Transport'],[barDs('Billing',[B.net-B.transport,B.transport],cssVar('--blue')),barDs('Costing',[B.costRec+B.costNonRec,B.costTrans],cssVar('--orange')),barDs('Profit',[cnfP,trP],cssVar('--green'))],{money:true});
  const ks=monthKeys(),g=groupBy(bills,b=>b.date.slice(0,7)),rev=ks.map(k=>sum(g.get(k)||[],b=>b.net)),cost=ks.map(k=>sum(g.get(k)||[],b=>b.costRec+b.costNonRec+b.costTrans));
  mkChart('g_ch4','bar',ks.map(mLabel),[barDs('Revenue',rev,cssVar('--blue')),barDs('Cost',cost,cssVar('--orange')),{type:'line',label:'GP %',data:rev.map((r,i)=>r?(r-cost[i])/r*100:0),borderColor:cssVar('--green'),backgroundColor:cssVar('--green'),yAxisID:'y2',tension:.3,pointRadius:4}],{money:true,y2:true});
  const tc=topN(bills,b=>b.cust,P,7);mkChart('g_ch5','bar',tc.map(x=>x[0]),[barDs('Gross Profit',tc.map(x=>x[1]),cssVar('--green'))],{horizontal:true,money:true,legend:false});
  GRIDS.g_g.setRows([...bills].reverse(),BILLS.length);
}

   ${gridCard('r_g','Job Number Wise Reconcile Statement','(Excel export includes every expense head)')}`;
  const ht=HI('Airport Road Transport Bill'),hd=HI('Duty, Vat & Global Tax'),hl=HI('Labour Charge');
  const main=[ht,hd,hl];
  const xheads=RECON_HEADS.map((n,i)=>({k:'h'+i,l:esc(n),t:'amt',tot:true,v:r=>r.e[i]||0}));
  const base=[{t:'sn',l:'SL',w:'38px'},{k:'jobNo',l:'Job No',cls:'mono nw'},{k:'cust',l:'Customer',hide:'md'},{k:'rev',l:'Revenue / Total Bill',t:'amt',tot:true}];

function renderRecon(){
  const rows=RECON_ROWS.filter(reconOK),n=rows.length,rev=sum(rows,x=>x.rev),exp=sum(rows,x=>x.exp),pr=sum(rows,x=>x.profit),gp=rev?pr/rev*100:0;

  <div class="bar"><span>Print preview – use Ctrl+P / “Save as PDF”</span><button onclick="print()">Print</button></div>
  <h1>${esc(CONFIG.company)}</h1><h2>${esc(X.title)} · generated ${new Date().toLocaleString('en-GB')}</h2>
  <div class="f">${X.filters.map(f=>`<span>${esc(f[0])}: <b>${esc(f[1])}</b></span>`).join('')}</div>
  <div class="ks">${kp}</div><div class="cs">${ch}</div>${tb}</body></html>`);w.document.close();
}
function exportPDF(){
  if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF library not loaded – check the internet connection.');return;}
  const X=collectExport(),doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=28;
  const bd=s=>String(s).replace(/৳/g,'BDT').replace(/[^\x00-\xFF–—]/g,'');
  doc.setFillColor(10,47,108);doc.rect(0,0,W,46,'F');doc.setTextColor(255);doc.setFontSize(15);doc.setFont(undefined,'bold');doc.text(bd(CONFIG.company),M,21);
  doc.setFontSize(10);doc.setFont(undefined,'normal');doc.text(bd(X.title)+'   |   Generated '+new Date().toLocaleString('en-GB'),M,37);
  doc.setTextColor(40);doc.setFontSize(8.5);doc.text(bd(X.filters.map(f=>f[0]+': '+f[1]).join('    ')),M,62);
  let y=72;const per=4,rows=[];for(let i=0;i<X.kpis.length;i+=per)rows.push(X.kpis.slice(i,i+per));
  doc.autoTable({startY:y,theme:'grid',styles:{fontSize:8,cellPadding:4},body:rows.map(r=>{const a=[];r.forEach(k=>a.push({content:bd(k[0]),styles:{fontStyle:'bold',fillColor:[238,243,251],textColor:[60,75,100]}},bd(k[1])));return a;}),margin:{left:M,right:M}});
  y=doc.lastAutoTable.finalY+10;
  // charts: 3 per row
  const cw=(W-2*M-20)/3;let x=M,rowH=0;
  X.charts.forEach(c=>{const h=Math.min(cw*c.h/c.w,150);if(x+cw>W-M+1){x=M;y+=rowH+8;rowH=0;}
    if(y+h+14>H-M){doc.addPage();y=M;x=M;rowH=0;}
    doc.setFontSize(8);doc.setFont(undefined,'bold');doc.text(bd(c.title),x,y+8);doc.addImage(c.img,'PNG',x,y+11,cw,h);rowH=Math.max(rowH,h+14);x+=cw+10;});
  y+=rowH+10;
  X.tables.forEach(t=>{
    const head=[t.cols.map(c=>bd(plain(c.l)))],body=t.rows.map((r,i)=>t.cols.map(c=>bd(cellTxt(c,r,i))));
    if(y>H-80){doc.addPage();y=M;}doc.setFontSize(10);doc.setFont(undefined,'bold');doc.setTextColor(10,47,108);doc.text(bd(t.name)+' ('+t.rows.length+' rows)',M,y+8);
    doc.autoTable({startY:y+14,head,body,theme:'grid',styles:{fontSize:6.8,cellPadding:2.2,overflow:'linebreak'},headStyles:{fillColor:[10,47,108],halign:'center'},margin:{left:M,right:M},
      columnStyles:Object.fromEntries(t.cols.map((c,i)=>[i,{halign:isNum(c)?'right':'left'}])),
      didParseCell:d=>{if(d.section==='body'&&t.g.o.rowCls){const cl=t.g.o.rowCls(t.rows[d.row.index]);if(/l1|l2|total|head|sub/.test(cl))d.cell.styles.fontStyle='bold';if(/l1|total/.test(cl))d.cell.styles.fillColor=[223,234,249];}}});
    y=doc.lastAutoTable.finalY+16;});
  const n=doc.internal.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(120);doc.text('Page '+i+' of '+n,W-M,H-12,{align:'right'});doc.text(bd(CONFIG.company),M,H-12);}
  doc.save(X.title.replace(/[^\w]+/g,'_')+'_'+CONFIG.dataEnd+'.pdf');
}
function exportExcel(){
  if(!window.XLSX){alert('Excel library not loaded – check the internet connection.');return;}
  const X=collectExport(),wb=XLSX.utils.book_new();
  const sm=[[CONFIG.company],[X.title],['Generated',new Date().toLocaleString('en-GB')],[],...X.filters.map(f=>[f[0],f[1]]),[],['Indicator','Value','Note'],...X.kpis.map(k=>[k[0],k[1],k[2]])];
  const ws0=XLSX.utils.aoa_to_sheet(sm);ws0['!cols']=[{wch:34},{wch:28},{wch:46}];XLSX.utils.book_append_sheet(wb,ws0,'Summary');
  X.tables.forEach(t=>{
    t={...t,cols:t.xcols};
    const aoa=[t.cols.map(c=>plain(c.l))];
    t.rows.forEach((r,i)=>aoa.push(t.cols.map(c=>{if(c.t==='sn')return i+1;if(c.x&&!isNum(c))return c.x(r,i);if(c.t==='badge')return r[c.k];const v=c.v?c.v(r):r[c.k];if(c.r&&c.x&&c.t!=='money'&&c.t!=='pct')return c.x(r,i);
      if(c.t==='date')return dmy(v);if(['money','amt','int'].includes(c.t))return v==null||v===''?null:+v;if(c.t==='pct')return +(+v).toFixed(2);if(c.x)return c.x(r,i);return v;})));
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=t.cols.map(c=>({wch:Math.max(10,Math.min(42,plain(c.l).length+6,c.t==='text'||!c.t?40:16))}));
    for(let R=1;R<aoa.length;R++)t.cols.forEach((c,ci)=>{const a=XLSX.utils.encode_cell({r:R,c:ci});if(ws[a]&&ws[a].t==='n')ws[a].z=c.t==='int'?'#,##0':c.t==='pct'?'0.00':'#,##0.00';});
    XLSX.utils.book_append_sheet(wb,ws,t.name.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31));});
  XLSX.writeFile(wb,X.title.replace(/[^\w]+/g,'_')+'_'+CONFIG.dataEnd+'.xlsx');
}

function fillSelect(id,items,all){const s=$('#'+id);s.innerHTML=`<option value="">${all}</option>`+items.map(i=>`<option value="${esc(i[0])}">${esc(i[1])}</option>`).join('');}
const RANGES=[['custom','Custom'],['mtd','This month'],['7','Last 7 days'],['30','Last 30 days'],['90','Last 3 months'],['fy','Fiscal year to date'],['dflt','Default range']];
function applyRange(k){
  const to=CONFIG.dataEnd;
  if(k==='mtd')F.from=to.slice(0,8)+'01';else if(k==='7')F.from=addDays(to,-6);else if(k==='30')F.from=addDays(to,-29);else if(k==='90')F.from=addDays(to,-89);else if(k==='fy')F.from=CONFIG.fyStart;else if(k==='dflt')F.from=CONFIG.defaultFrom;else return;
  F.to=to;$('#fFrom').value=F.from;$('#fTo').value=F.to;
}
function syncInputs(){$('#fFrom').value=F.from;$('#fTo').value=F.to;$('#fBranch').value=F.branch;$('#fMode').value=F.mode;$('#fPort').value=F.port;$('#fCust').value=F.cust;$('#fStatus').value=F.status;$('#fRange').value=F.from===CONFIG.defaultFrom&&F.to===CONFIG.dataEnd?'dflt':'custom';}
function init(){
  document.title=CONFIG.title;$('#appTitle').textContent=CONFIG.title;$('#coName').textContent=CONFIG.company+' · Clearing & Forwarding ERP';
  $('#logo').innerHTML=ico('ship',22);$('#ftitle').innerHTML=ico('filter',16)+' Filter By';
  $('#btnReset').innerHTML=ico('reset',15)+' Reset';$('#btnExport').innerHTML=ico('download',15)+' Export '+ico('chev',13);
  $('#xPreview').innerHTML=ico('printer',16)+' Print / Preview';$('#xPdf').innerHTML=ico('pdf',16)+' PDF';$('#xExcel').innerHTML=ico('sheet',16)+' Excel';
  $('#footNote').textContent='Job Reconcile tab uses your uploaded statement; other tabs use sample data generated in the browser – connect the DataService (section 3.5) to your ERP. Amounts in BDT.';
  const clk=()=>{$('#clock').textContent=new Date().toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});};clk();setInterval(clk,30000);
  buildCnfData();buildLedger();setupCharts();
  fillSelect('fBranch',BRANCHES.map(b=>[b.id,b.name]),'All Branches');fillSelect('fMode',MODES.map(m=>[m,m]),'All Modes');fillSelect('fPort',PORTS.map(p=>[p.id,p.name]),'All Ports');
  fillSelect('fCust',[...new Set([...CUSTOMERS.map(c=>c[0]),...RECON_ROWS.map(x=>x.cust)])].sort().map(c=>[c,c]),'All Customers');fillSelect('fStatus',STATUSES.map(s=>[s,s]),'All Status');
  $('#fRange').innerHTML=RANGES.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('');
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" data-t="${t.id}">${ico(t.i,16)} ${t.l}</button>`).join('');
  buildOverview();buildJobs();buildBills();buildGP();buildRecon();buildAccounts();
  const bind=(id,key)=>$('#'+id).addEventListener('change',e=>{F[key]=e.target.value;if(key==='from'||key==='to'){if(F.to<F.from){if(key==='from')F.to=F.from;else F.from=F.to;}$('#fFrom').value=F.from;$('#fTo').value=F.to;$('#fRange').value='custom';}refresh();});
  bind('fFrom','from');bind('fTo','to');bind('fBranch','branch');bind('fMode','mode');bind('fPort','port');bind('fCust','cust');bind('fStatus','status');
  $('#fRange').addEventListener('change',e=>{applyRange(e.target.value);refresh();});
  $('#btnReset').onclick=()=>{F=DEF();syncInputs();$$('.gtools input[type=search]').forEach(i=>i.value='');Object.values(GRIDS).forEach(g=>{g.q='';g.sk=null;});refresh();};
  $('#btnExport').onclick=e=>{e.stopPropagation();$('#expMenu').classList.toggle('open');};
  document.addEventListener('click',()=>$('#expMenu').classList.remove('open'));
  $('#expMenu .pop').onclick=e=>{const b=e.target.closest('button');if(!b)return;({preview:exportPreview,pdf:exportPDF,excel:exportExcel})[b.dataset.x]();};
  $('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)showTab(b.dataset.t);};
  syncInputs();buildView();
  let t0='overview';try{const h=location.hash.slice(1);if(TABS.some(t=>t.id===h))t0=h;}catch(e){}
  SUB='summary';showTab(t0);
}
window.addEventListener('DOMContentLoaded',init);
